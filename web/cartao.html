<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Impressão do cartão</title>
<style id="pagina">@page { size: A4 portrait; margin: 0; }</style>
<style>

  /* Cartão no formato A6 deitado (148 x 105 mm) */
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d6d6d6; }
  body {
    font-family: Arial, Helvetica, "Liberation Sans", FreeSans, sans-serif;
    color: #111;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .narrow { font-family: "Arial Narrow", "Liberation Sans Narrow", "Roboto Condensed", "DejaVu Sans Condensed", Arial, sans-serif; font-stretch: condensed; }

  /* barra de ferramentas (não imprime) */
  .toolbar { position: sticky; top: 0; z-index: 10; background: #1f2933; color: #fff; padding: 10px 16px;
    font: 13px/1.4 Arial, sans-serif; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .toolbar button { background: #fff; color: #111; border: 0; border-radius: 4px; padding: 6px 14px; font-weight: bold; cursor: pointer; }
  .toolbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .label-card { font: bold 12px Arial, sans-serif; color: #444; margin: 22px auto 6px; width: 148mm; }

  .card { width: 148mm; height: 105mm; background: #fff; margin: 0 auto; position: relative; overflow: hidden;
    break-after: page; page-break-after: always; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .card > * { position: absolute; }

  [contenteditable] { outline: 1px dashed #4a90d9; outline-offset: 1px; min-width: 15mm; min-height: 1em; display: inline-block; }
  .hide-guides [contenteditable] { outline: none; }

  .brasao { display: flex; align-items: center; justify-content: center; text-align: center;
    border: 0.25mm dashed #aaa; border-radius: 1mm; font-size: 5pt; color: #999; line-height: 1.15; }
  .brasao img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; }
  .brasao.has-img { border: 0; }
  .brasao img { filter: grayscale(1) contrast(1.15); }
  .cores .brasao img { filter: none; }
  .hide-guides .brasao:not(.has-img), .hide-guides .carimbo { border-color: transparent; color: transparent; }

  .wm60 { object-fit: contain; }
  .b { font-weight: bold; }
  .t { white-space: nowrap; line-height: 1; margin-top: -0.13em; }
  .fit { transform-origin: 0 0; }
  .val { font-weight: normal; font-size: 9pt; }
  .center { text-align: center; }
  /* nome do beneficiário na frente: maior e centralizado sobre a linha (diminui sozinho se for muito longo) */
  .nome-frente { text-align: center; font-weight: bold; letter-spacing: .1mm; }
  .nome-frente span { display: block; width: 100%; }

  /* ===== VERSO ===== */
  .back .benef { left: 8mm; top: 4.6mm; width: 132mm; font-size: 9.6pt; font-weight: bold; display: flex; align-items: flex-end; white-space: nowrap; }
  .back .benef .linha { flex: 1; border-bottom: 0.3mm solid #222; margin-left: 1.5mm; min-height: 5.6mm; padding-left: 1.5mm; font-weight: bold; font-size: 13pt; line-height: 1.15; overflow: hidden; }
  .back .benef .linha { display: flex; align-items: flex-end; }
  .back .benef .linha [data-f] { display: block; width: 100%; line-height: 1.1; padding-bottom: .3mm; }
  .back .benef.reg { top: 11.4mm; width: 78mm; }
  .back .benef .linha [contenteditable] { width: 97%; }
  .back .titulo { left: 3mm; width: 142mm; top: 18.6mm; text-align: center; font-weight: bold; font-size: 10.5pt; letter-spacing: .5mm; }
  .back .titulo::after { content: ""; display: block; width: 26mm; margin: 1.1mm auto 0; border-top: 0.3mm solid #222; }
  .back .rules { left: 8mm; top: 25mm; width: 132mm; height: 74mm; font-size: 8.2pt; line-height: 1.24; }
  .back .it { display: grid; grid-template-columns: 4.6mm 1fr; margin-top: .9mm; }
  .back .it.sub { margin-left: 4.6mm; grid-template-columns: 6.2mm 1fr; margin-top: .25mm; }
  .back .it .n { font-weight: bold; }
  .back .it .tx { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
  .back .it:first-child { margin-top: 0; }

  @media print {
    html, body { background: #fff; }
    .toolbar, .label-card, .spacer { display: none !important; }
    .card { margin: 0; box-shadow: none; }
    .card:last-of-type { break-after: auto; page-break-after: auto; }
    [contenteditable] { outline: none !important; }
    .brasao:not(.has-img), .carimbo { border-color: transparent !important; color: transparent !important; }
  }

  .qrbox { text-align: center; }
  .qr svg { display: block; width: 100%; height: auto; }
  .qrleg { font: bold 4.6pt Arial, sans-serif; letter-spacing: .1mm; margin-top: .4mm; }
  /* páginas de impressão (montadas pelo cartao.js) */
  .pagina { position: relative; background: #fff; margin: 0 auto 18px; box-shadow: 0 2px 8px rgba(0,0,0,.25); overflow: hidden;
            break-after: page; page-break-after: always; }
  .pagina:last-child { break-after: auto; page-break-after: auto; }
  .slot { position: absolute; }
  .slot .card { margin: 0; box-shadow: none; transform-origin: 0 0; position: absolute; left: 0; top: 0; break-after: auto; page-break-after: auto; }
  .corte-linha { position: absolute; outline: 0.2mm dotted #999; pointer-events: none; }
  .dobra { position: absolute; height: 0; border-top: 0.25mm dashed #777; }
  .dobra span { position: absolute; right: 0; top: -3.4mm; font: 6.5pt Arial; color: #777; }
  .carimbo-verso { border: 0.3mm solid #444; display: flex; align-items: flex-end; justify-content: center; }
  .carimbo-leg { font: bold 5.4pt Arial, sans-serif; text-align: center; letter-spacing: .1mm; color: #222; white-space: nowrap; }
  .msg { max-width: 600px; margin: 60px auto; font: 15px/1.5 Arial; text-align: center; }
  .cores .brasao img { filter: none; }
  @media print {
    .pagina { box-shadow: none; margin: 0; }
  }
</style>
</head>
