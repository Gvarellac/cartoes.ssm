<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Impressão da credencial</title>
<style id="pagina">@page { size: A4 portrait; margin: 0; }</style>
<style>
  /* Credencial de estacionamento – modelo da Res. Contran 965/2022, alterada pela Res. 1.012/2024 (Anexo III)
     Tamanho oficial: 129 x 84,5 mm. Fundo branco, letras pretas, tarja e símbolo em azul. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d6d6d6; }
  body { font-family: Arial, Helvetica, "Liberation Sans", FreeSans, sans-serif; color: #111;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* barra de ferramentas (não imprime) */
  .toolbar { position: sticky; top: 0; z-index: 10; background: #1f2933; color: #fff; padding: 10px 16px;
    font: 13px/1.4 Arial, sans-serif; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .toolbar button { background: #fff; color: #111; border: 0; border-radius: 4px; padding: 6px 14px; font-weight: bold; cursor: pointer; }
  .toolbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
  .toolbar button.assinar { background: #0b7a3b; color: #fff; }
  .toolbar #assinar-senha { padding: 5px 8px; border-radius: 4px; border: 0; width: 170px; }
  .toolbar #assinar-msg { font-weight: bold; color: #fecdca; }
  .aviso-assinatura { max-width: 820px; margin: 14px auto 0; background: #fffaeb; border: 1px solid #fedf89; color: #7a2e0e;
    border-radius: 8px; padding: 10px 14px; font: 14px/1.4 Arial, sans-serif; }
  .msg { max-width: 600px; margin: 60px auto; font: 15px/1.5 Arial; text-align: center; }

  /* páginas montadas pelo cartao.js */
  .pagina { position: relative; background: #fff; margin: 18px auto; box-shadow: 0 2px 8px rgba(0,0,0,.25); overflow: hidden;
            break-after: page; page-break-after: always; }
  .pagina:last-child { break-after: auto; page-break-after: auto; }
  .slot { position: absolute; width: 129mm; height: 84.5mm; }
  .slot.girado .card { transform: rotate(180deg); }
  .corte { position: absolute; outline: 0.2mm dotted #888; pointer-events: none; }
  .dobra { position: absolute; height: 0; border-top: 0.25mm dashed #666; }
  .guia { position: absolute; font: 6.5pt Arial; color: #777; white-space: nowrap; }

  /* ===== CREDENCIAL ===== */
  .card { width: 129mm; height: 84.5mm; position: relative; background: #fff; overflow: hidden; }
  .card > * { position: absolute; }
  .azul { background: #0b4ea2; }
  .b { font-weight: bold; }
  .c { text-align: center; }
  .nw { white-space: nowrap; overflow: hidden; }
  .lbl { font-weight: bold; }

  /* frente */
  .simbolo { left: 2.5mm; top: 2.5mm; width: 10mm; height: 10mm; display: flex; align-items: center; justify-content: center; }
  .tarja { left: 2.5mm; top: 14.5mm; width: 10mm; height: 67.5mm; display: flex; align-items: center; justify-content: center; }
  .tarja div { transform: rotate(-90deg); color: #fff; font-size: 17pt; font-weight: bold; letter-spacing: 1.6mm; white-space: nowrap; }
  .moldura { left: 14.5mm; top: 2.5mm; width: 112mm; height: 79.5mm; border: 0.3mm solid #8a8a8a; }
  .marca { left: 44mm; top: 19.5mm; width: 56mm; height: 56mm; background: #e6e6e6; display: flex; align-items: center; justify-content: center; }
  .marca img, .marca svg, .simbolo img, .simbolo svg { position: static; }
  .ass-img { left: 47mm; top: 62.6mm; width: 50mm; height: 5.6mm; display: flex; align-items: flex-end; justify-content: center; }
  .ass-img img { position: static; max-width: 100%; max-height: 100%; object-fit: contain; }
  .ass-cursiva { font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", "URW Chancery L", "Z003", cursive; font-size: 13pt; white-space: nowrap; }
  .ass-pendente { font-size: 6pt; font-weight: bold; color: #b54708; letter-spacing: .3mm; }
  .ass-txt { left: 38mm; top: 68.7mm; width: 68mm; text-align: center; line-height: 1.17; }
  .ass-txt div { white-space: nowrap; overflow: hidden; }

  /* verso */
  .verso-borda { left: 1.5mm; top: 1.5mm; width: 126mm; height: 81.5mm; border: 0.3mm solid #444; }
  .itens { left: 7mm; top: 17mm; width: 115mm; font-size: 7.3pt; line-height: 1.28; }
  .itens .it { display: grid; grid-template-columns: 5mm 1fr; margin-top: 1.5mm; }
  .itens .it:first-child { margin-top: 0; }
  .itens .sub { margin-left: 5mm; grid-template-columns: 6mm 1fr; margin-top: .3mm; }

  @media print {
    html, body { background: #fff; }
    .toolbar, .aviso-assinatura { display: none !important; }
    .pagina { box-shadow: none; margin: 0; }
    body.bloqueado #area { display: none !important; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <strong id="titulo">Credencial</strong>
  <label><input type="radio" name="fmt" value="a4" checked> A4 – frente e verso na mesma folha para <b>dobrar</b> (recortar, dobrar e plastificar)</label>
  <label><input type="radio" name="fmt" value="duplex"> A4 – impressora frente e verso (uma página para cada lado)</label>
  <button id="imprimir">Imprimir</button>
  <span id="assinar-box" hidden>
    <button id="assinar" class="assinar">Assinar</button>
    <span id="assinar-form" hidden>Senha: <input type="password" id="assinar-senha" autocomplete="current-password">
      <button id="assinar-ok" class="assinar">Confirmar assinatura</button> <button id="assinar-cancela">Cancelar</button></span>
    <span id="assinar-msg"></span>
  </span>
</div>
<!-- Símbolo Internacional de Acesso -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="isa" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M36 30 L39 58 L64 58 L73 82 L81 79"/>
        <path d="M37 41 L58 41"/>
        <path d="M60 74 A22 22 0 1 1 30 46"/>
      </g>
      <circle cx="35" cy="15" r="8.5" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
<div id="aviso-ass"></div>
<div id="area"><div class="msg">Carregando…</div></div>

<template id="t-frente">
<div class="card frente">
  <div class="azul simbolo" data-f="simbolo"></div>
  <div class="azul tarja"><div>CREDENCIAL</div></div>
  <div class="moldura"></div>
  <div class="marca" data-f="marca"></div>
  <img src="/img/brasao-brasil.png" alt="" style="left:18.5mm;top:4.5mm;width:14.5mm;height:13.5mm;object-fit:contain">
  <div class="b c nw" style="left:33mm;top:5.6mm;width:73mm;font-size:10pt;line-height:1.25">REPÚBLICA FEDERATIVA DO BRASIL<br>CONSELHO NACIONAL DE TRÂNSITO</div>
  <img src="/img/brasao-bage.png" alt="" style="left:106mm;top:4mm;width:16mm;height:12mm;object-fit:contain">
  <div class="b c nw" style="left:20mm;top:22.6mm;width:102mm;font-size:13.5pt">ESTACIONAMENTO VAGA RESERVADA</div>
  <div class="b c nw" style="left:20mm;top:28.6mm;width:102mm;font-size:6.5pt">LEI FEDERAL Nº 9.503/1997</div>
  <div class="c nw" style="left:20mm;top:33.6mm;width:102mm;font-size:10pt"><span class="lbl">Nº DO REGISTRO :</span> <b data-f="registro"></b></div>
  <div style="left:19mm;top:40mm;width:102.6mm;border-top:0.35mm solid #333"></div>
  <div class="nw" style="left:25.8mm;top:45.4mm;width:40mm;font-size:8.5pt" data-f="validade"></div>
  <div class="nw" style="left:67.8mm;top:45.4mm;width:56mm;font-size:8.5pt"><span class="lbl">DATA DE EMISSÃO:</span> <span data-f="emissao"></span></div>
  <div class="orgao" style="left:25.8mm;top:51.2mm;width:96mm;font-size:8.5pt;line-height:1.2;max-height:7.4mm;overflow:hidden"><span class="lbl">ÓRGÃO EXPEDIDOR:</span> <span data-f="orgao"></span></div>
  <div class="nw" style="left:25.8mm;top:59.6mm;width:40mm;font-size:8.5pt"><span class="lbl">MUNICÍPIO/UF:</span> <span data-f="municipio"></span></div>
  <div class="ass-img" data-f="ass-img"></div>
  <div style="left:50mm;top:68.3mm;width:44mm;border-top:0.25mm solid #333"></div>
  <div class="ass-txt" data-f="ass-txt"></div>
  <div style="left:106mm;top:58.5mm;width:16mm;height:16mm" data-f="qr"></div>
  <div class="b c nw" style="left:20mm;top:78.4mm;width:102mm;font-size:8pt">VÁLIDA EM TODO O TERRITÓRIO NACIONAL</div>
</div>
</template>

<template id="t-verso">
<div class="card verso">
  <div class="verso-borda"></div>
  <div class="b c nw" style="left:3mm;top:3.6mm;width:123mm;font-size:9pt">NOME DO BENEFICIÁRIO:</div>
  <div class="b c nw" style="left:3mm;top:7.6mm;width:123mm;font-size:12.5pt" data-f="nome"></div>
  <div class="c nw" style="left:3mm;top:12.9mm;width:123mm;font-size:6.5pt"><b>Nº DO REGISTRO:</b> <span data-f="registro"></span></div>
  <div class="itens">
    <div class="it"><b>1.</b><span>Esta credencial deve ser utilizada:</span></div>
    <div class="it sub"><span>1.1.</span><span>no original;</span></div>
    <div class="it sub"><span>1.2.</span><span>para o transporte do beneficiário; e</span></div>
    <div class="it sub"><span>1.3.</span><span>no painel do veículo, com a frente voltada para cima.</span></div>
    <div class="it"><b>2.</b><span data-f="item2"></span></div>
    <div class="it"><b>3.</b><span>Esta credencial não exime o beneficiário do pagamento de cobranças em estacionamento rotativo pago, estabelecimentos privados de uso coletivo e outras.</span></div>
    <div class="it"><b>4.</b><span>Esta credencial deve ser apresentada à autoridade de trânsito ou seus agentes sempre que solicitada.</span></div>
    <div class="it"><b>5.</b><span>Esta credencial pode ser suspensa ou cassada, a critério do órgão ou entidade de trânsito expedidor.</span></div>
    <div class="it"><b>6.</b><span>O uso da vaga reservada sem credencial ou em desacordo ao nela disposto, sujeitará o infrator à aplicação das medidas administrativas, penalidades e pontuação previstas no art. 181, XX do Código de Trânsito Brasileiro (CTB).</span></div>
  </div>
  <div class="nw" style="left:7mm;top:79.3mm;width:115mm;font-size:4.6pt;color:#444" data-f="servidor"></div>
</div>
</template>

<script src="/qr.js"></script>
<script src="/cartao.js"></script>
</body>
</html>
